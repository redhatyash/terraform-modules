name: Terraform CI

on:
  pull_request:
    paths:
      - '**/*.tf'
      - '.github/workflows/terraform-ci.yml'
      - '.tflint.hcl'
  push:
    branches:
      - main
    paths:
      - '**/*.tf'
      - '.github/workflows/terraform-ci.yml'
      - '.tflint.hcl'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: fmt-lint-validate-checkov
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: Terraform format check
        run: terraform fmt -check -recursive -diff

      - name: Terraform init and validate
        shell: bash
        run: |
          mapfile -t dirs < <(find . -type f -name '*.tf' \
            | xargs -r -n1 dirname \
            | sort -u \
            | sed 's#^\./##' \
            | grep -v '^\.terraform')

          if [ ${#dirs[@]} -eq 0 ]; then
            echo "No Terraform files found. Skipping init/validate."
            exit 0
          fi

          for dir in "${dirs[@]}"; do
            echo "Checking directory: $dir"
            (
              cd "$dir"
              terraform init -backend=false -input=false -no-color
              terraform validate -no-color
            )
          done

      - name: Terraform lint
        shell: bash
        run: |
          if find . -type f -name '*.tf' | grep -q .; then
            tflint --recursive --format compact
          else
            echo "No Terraform files found. Skipping TFLint."
          fi

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          quiet: true
          skip_check: CKV_GIT_1
